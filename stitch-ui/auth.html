<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>KuikReads - Authentication</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#ec9213",
              "background-light": "#f8f7f6",
              "background-dark": "#221a10",
              parchment: "#fdfaf6",
              "beige-border": "#e6e1db",
            },
            fontFamily: {
              display: ["Newsreader", "serif"],
              sans: ["Newsreader", "serif"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "1rem",
              xl: "1.5rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Newsreader", serif;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-start transition-colors duration-300"
  >
    <!-- Top App Bar -->
    <div
      class="w-full max-w-[480px] flex items-center bg-transparent p-4 pb-2 justify-between"
    >
      <div
        class="text-[#181511] dark:text-white flex size-12 shrink-0 items-center cursor-pointer"
      >
        <span class="material-symbols-outlined">chevron_left</span>
      </div>
      <h2
        class="text-[#181511] dark:text-white text-xl font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12"
      >
        KuikReads
      </h2>
    </div>
    <!-- Main Content Container -->
    <main class="w-full max-w-[480px] flex flex-col px-4">
      <!-- Segmented Control -->
      <div class="flex py-6">
        <div
          class="flex h-12 flex-1 items-center justify-center rounded-xl bg-[#edece9] dark:bg-[#32291d] p-1"
        >
          <label
            class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-[#453a2b] has-[:checked]:shadow-[0_2px_4px_rgba(0,0,0,0.05)] has-[:checked]:text-[#181511] dark:has-[:checked]:text-white text-[#897961] text-base font-medium transition-all"
          >
            <span class="truncate">Sign Up</span>
            <input
              checked=""
              class="invisible w-0"
              name="auth-toggle"
              type="radio"
              value="Sign Up"
            />
          </label>
          <label
            class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-[#453a2b] has-[:checked]:shadow-[0_2px_4px_rgba(0,0,0,0.05)] has-[:checked]:text-[#181511] dark:has-[:checked]:text-white text-[#897961] text-base font-medium transition-all"
          >
            <span class="truncate">Log In</span>
            <input
              class="invisible w-0"
              name="auth-toggle"
              type="radio"
              value="Log In"
            />
          </label>
        </div>
      </div>
      <!-- Auth Card -->
      <div
        class="bg-white dark:bg-[#2d2419] rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] p-6 mb-8 border border-beige-border/30 dark:border-white/5"
      >
        <div class="flex flex-col gap-5">
          <!-- Email Field -->
          <div class="flex flex-col">
            <p
              class="text-[#181511] dark:text-white/90 text-base font-medium leading-normal pb-2"
            >
              Email Address
            </p>
            <input
              class="form-input flex w-full rounded-xl text-[#181511] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-beige-border dark:border-[#453a2b] bg-parchment dark:bg-[#3a2f22] h-14 placeholder:text-[#897961] p-4 text-base font-normal"
              placeholder="your@email.com"
              value=""
            />
          </div>
          <!-- Password Field -->
          <div class="flex flex-col">
            <p
              class="text-[#181511] dark:text-white/90 text-base font-medium leading-normal pb-2"
            >
              Password
            </p>
            <div
              class="flex w-full items-stretch rounded-xl border border-beige-border dark:border-[#453a2b] bg-parchment dark:bg-[#3a2f22] focus-within:ring-2 focus-within:ring-primary/50"
            >
              <input
                class="form-input flex-1 border-none bg-transparent h-14 text-[#181511] dark:text-white placeholder:text-[#897961] px-4 text-base font-normal focus:ring-0"
                placeholder="••••••••"
                type="password"
                value=""
              />
              <div
                class="text-[#897961] flex items-center justify-center px-4 cursor-pointer"
              >
                <span class="material-symbols-outlined">visibility</span>
              </div>
            </div>
          </div>
          <!-- Main Action Button -->
          <button
            class="w-full mt-2 flex cursor-pointer items-center justify-center rounded-xl h-14 bg-primary hover:bg-[#d98511] text-[#181511] text-lg font-bold transition-colors"
          >
            <span>Create Account</span>
          </button>
        </div>
      </div>
      <!-- Divider -->
      <div class="flex items-center gap-4 mb-8">
        <div class="h-px flex-1 bg-beige-border dark:bg-white/10"></div>
        <span class="text-[#897961] text-sm font-medium italic">or</span>
        <div class="h-px flex-1 bg-beige-border dark:bg-white/10"></div>
      </div>
      <!-- Social Sign-In -->
      <div class="flex flex-col gap-3">
        <button
          class="flex w-full items-center justify-center gap-3 rounded-xl h-14 bg-white dark:bg-white text-black border border-beige-border dark:border-transparent font-medium shadow-sm hover:bg-gray-50 transition-colors"
        >
          <svg class="w-5 h-5" viewbox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            ></path>
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            ></path>
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
              fill="#FBBC05"
            ></path>
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            ></path>
          </svg>
          <span>Continue with Google</span>
        </button>
        <button
          class="flex w-full items-center justify-center gap-3 rounded-xl h-14 bg-black text-white font-medium hover:bg-gray-900 transition-colors"
        >
          <svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
            <path
              d="M17.05 20.28c-.96 0-2.04-.6-3.23-.6-1.2 0-2.14.57-3.2.57-1.77 0-4.33-2.17-4.33-5.2 0-3.08 1.94-4.7 3.8-4.7 1 0 1.83.62 2.65.62.77 0 1.84-.71 3-.71 1.17 0 2.24.53 2.92 1.54-2.52 1.35-2.1 4.77.46 5.86-1.14 1.76-2.43 3.42-4.07 3.42zm-2.72-13.84c.54-.65.91-1.56.91-2.47 0-.12-.02-.24-.03-.34-.86.03-1.89.58-2.51 1.3-.53.6-.99 1.52-.99 2.45 0 .14.02.26.04.34.95.07 1.9-.45 2.58-1.28z"
            ></path>
          </svg>
          <span>Continue with Apple</span>
        </button>
      </div>
      <!-- Footer Links -->
      <div class="mt-12 mb-8 flex flex-col items-center gap-4">
        <button
          class="text-primary font-bold text-base hover:underline underline-offset-4"
        >
          Continue without account
        </button>
        <p class="text-[#897961] text-xs text-center px-8 leading-relaxed">
          By creating an account, you agree to our
          <a class="underline" href="#">Terms of Service</a> and
          <a class="underline" href="#">Privacy Policy</a>.
        </p>
      </div>
    </main>
    <!-- Aesthetic Decorative Element -->
    <div
      class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/30 to-transparent"
    ></div>
  </body>
</html>
