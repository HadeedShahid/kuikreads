<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#ee752b",
              "background-light": "#fdfaf4",
              "background-dark": "#221710",
              "warm-cream": "#fdfaf4",
              "warm-caramel": "#ee752b",
            },
            fontFamily: {
              display: ["Newsreader", "serif"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "1rem",
              xl: "1.5rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .filled-icon {
        font-variation-settings:
          "FILL" 1,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      body {
        font-family: "Newsreader", serif;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col transition-colors duration-300"
  >
    <!-- Subtle Progress Bar at the very top -->
    <div
      class="fixed top-0 left-0 w-full h-1 bg-[#e6dfdb] dark:bg-zinc-800 z-50"
    >
      <div class="h-full bg-primary" style="width: 42%"></div>
    </div>
    <!-- Header / Meta Info -->
    <header class="pt-8 px-6 flex justify-between items-center w-full">
      <div class="flex flex-col">
        <span
          class="text-[#897161] dark:text-[#a18a7a] text-xs uppercase tracking-widest font-bold"
          >Chapter 12</span
        >
        <h2 class="text-[#181411] dark:text-white text-sm font-medium">
          The Great Gatsby
        </h2>
      </div>
      <button
        class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 text-[#897161]"
      >
        <span class="material-symbols-outlined">more_vert</span>
      </button>
    </header>
    <!-- Main RSVP Reading Area -->
    <main
      class="flex-grow flex flex-col items-center justify-center px-4 relative"
    >
      <!-- Word Display Container -->
      <div
        class="w-full max-w-md aspect-video flex flex-col items-center justify-center relative"
      >
        <!-- Optimal Recognition Point Guides (Optional subtle visual aid) -->
        <div
          class="absolute top-1/2 left-1/2 -translate-x-[2ch] -translate-y-1/2 w-[2px] h-12 bg-primary/10 rounded-full hidden"
        ></div>
        <!-- The Word -->
        <div
          class="text-[56px] md:text-[64px] font-bold tracking-tight text-[#181411] dark:text-[#f3f0ee] select-none flex"
        >
          <span>Recogni</span
          ><span class="text-primary underline decoration-2 underline-offset-8"
            >t</span
          ><span>ion</span>
        </div>
        <!-- Reading Speed Indicator -->
        <div class="mt-8">
          <p
            class="text-primary text-sm font-bold tracking-widest uppercase bg-primary/10 px-4 py-1 rounded-full"
          >
            400 WPM
          </p>
        </div>
      </div>
    </main>
    <!-- Bottom Control Interface -->
    <section class="pb-10 px-6 w-full max-w-lg mx-auto">
      <!-- Playback Controls -->
      <div class="flex items-center justify-between mb-8">
        <div class="flex gap-4">
          <button
            class="w-12 h-12 flex items-center justify-center rounded-full text-[#181411] dark:text-white hover:bg-black/5 dark:hover:bg-white/5"
          >
            <span class="material-symbols-outlined text-[28px]">replay_10</span>
          </button>
          <button
            class="w-12 h-12 flex items-center justify-center rounded-full text-[#181411] dark:text-white hover:bg-black/5 dark:hover:bg-white/5"
          >
            <span class="material-symbols-outlined text-[28px]"
              >skip_previous</span
            >
          </button>
        </div>
        <!-- Central Play Button -->
        <button
          class="w-20 h-20 bg-primary text-white flex items-center justify-center rounded-full shadow-lg shadow-primary/30 active:scale-95 transition-transform"
        >
          <span class="material-symbols-outlined text-[48px] filled-icon"
            >pause</span
          >
        </button>
        <div class="flex gap-4">
          <button
            class="w-12 h-12 flex items-center justify-center rounded-full text-[#181411] dark:text-white hover:bg-black/5 dark:hover:bg-white/5"
          >
            <span class="material-symbols-outlined text-[28px]">skip_next</span>
          </button>
          <button
            class="w-12 h-12 flex items-center justify-center rounded-full text-[#181411] dark:text-white hover:bg-black/5 dark:hover:bg-white/5"
          >
            <span class="material-symbols-outlined text-[28px]"
              >forward_10</span
            >
          </button>
        </div>
      </div>
      <!-- Toolbar / Settings Row -->
      <div class="flex justify-between items-center px-2">
        <button
          class="flex items-center gap-2 text-[#897161] dark:text-[#a18a7a] font-medium text-sm"
        >
          <span class="material-symbols-outlined text-[20px]">text_fields</span>
          <span>Appearance</span>
        </button>
        <div class="h-4 w-[1px] bg-[#e6dfdb] dark:bg-zinc-700"></div>
        <button
          class="flex items-center gap-2 text-[#897161] dark:text-[#a18a7a] font-medium text-sm"
        >
          <span class="material-symbols-outlined text-[20px]">speed</span>
          <span>Speed Settings</span>
        </button>
      </div>
    </section>
    <!-- Navigation Bar -->
    <nav
      class="border-t border-[#f4f2f0] dark:border-zinc-800 bg-warm-cream dark:bg-background-dark pb-8 pt-4 px-6"
    >
      <div class="flex justify-between max-w-md mx-auto">
        <a
          class="flex flex-col items-center gap-1 text-[#897161] dark:text-[#a18a7a]"
          href="#"
        >
          <span class="material-symbols-outlined text-[24px]"
            >local_library</span
          >
          <span class="text-[10px] font-bold uppercase tracking-wider"
            >Library</span
          >
        </a>
        <a class="flex flex-col items-center gap-1 text-primary" href="#">
          <span class="material-symbols-outlined text-[24px] filled-icon"
            >bolt</span
          >
          <span class="text-[10px] font-bold uppercase tracking-wider"
            >Read</span
          >
        </a>
        <a
          class="flex flex-col items-center gap-1 text-[#897161] dark:text-[#a18a7a]"
          href="#"
        >
          <span class="material-symbols-outlined text-[24px]">insights</span>
          <span class="text-[10px] font-bold uppercase tracking-wider"
            >Stats</span
          >
        </a>
        <a
          class="flex flex-col items-center gap-1 text-[#897161] dark:text-[#a18a7a]"
          href="#"
        >
          <span class="material-symbols-outlined text-[24px]">settings</span>
          <span class="text-[10px] font-bold uppercase tracking-wider"
            >Settings</span
          >
        </a>
      </div>
    </nav>
  </body>
</html>
